name: viggo-operativo-web

services:
  frontend:
    container_name: viggo-operativo-web
    image: ${FRONTEND_IMAGE:-viggo-operativo-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-prod}
      secrets:
        - frontend_env
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3004}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  frontend_env:
    file: ${FRONTEND_ENV_FILE:-.env.docker}
